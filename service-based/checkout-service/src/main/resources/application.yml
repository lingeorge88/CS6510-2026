server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: checkout-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:selfcheckout}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_SIZE:10}
      pool-name: checkoutPool
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
