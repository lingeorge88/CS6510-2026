# API Gateway for the service-based self-checkout system.
#
# The load client speaks to a single base URL (http://localhost:8080) and the
# OpenAPI contract is one flat namespace. This gateway is the service-based
# style's "separately deployed user-facing proxy": it path-routes each endpoint
# to the domain service that owns it, so the external contract is unchanged while
# the work fans out to independently deployable containers.
#
# These are gateway -> service hops (plain REST). Domain services never call each
# other; all inter-domain coupling is at the shared database.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream catalog   { server catalog-service:8081;   keepalive 32; }
    upstream checkout  { server checkout-service:8082;   keepalive 32; }
    upstream analytics { server analytics-service:8084;  keepalive 32; }

    server {
        listen 8080;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Catalog Service owns catalog reference data and inventory.
        location = /items            { proxy_pass http://catalog; }
        location /inventory/         { proxy_pass http://catalog; }

        # Checkout Service owns the transaction lifecycle.
        location /transactions       { proxy_pass http://checkout; }

        # Analytics Service owns popular-items.
        location /analytics/         { proxy_pass http://analytics; }
    }
}
